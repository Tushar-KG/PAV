<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Matte Dark Slate Container -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141721" />
      <stop offset="100%" stop-color="#0B0D13" />
    </linearGradient>

    <!-- Electric Cyan to Indigo Gradient -->
    <linearGradient id="cyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4" />

  <!-- Minimalist P-Play Mark -->
  <g transform="translate(142, 136)">
    <!-- Vertical Stem -->
    <rect x="0" y="0" width="46" height="240" rx="23" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Geometric Play Head -->
    <path d="M 76 16 
             C 76 6, 88 1, 96 6 
             L 218 95 
             C 228 102, 228 118, 218 125 
             L 96 214 
             C 88 219, 76 214, 76 204 
             Z" fill="url(#cyanViolet)" />
  </g>
</svg>
